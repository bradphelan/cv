name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and wkhtmltopdf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc wkhtmltopdf xvfb

      - name: Prepare output directories
        run: mkdir -p _site/de

      - name: Build English HTML
        run: |
          pandoc README.md -o _site/index.html \
            --standalone \
            --css style.css \
            --metadata title="Brad Phelan — CV"

      - name: Build German HTML
        run: |
          pandoc README.de.md -o _site/de/index.html \
            --standalone \
            --css style.css \
            --metadata title="Brad Phelan — Lebenslauf"

      - name: Copy stylesheet
        run: cp style.css _site/style.css && cp style.css _site/de/style.css

      - name: Build English PDF
        run: |
          xvfb-run --auto-servernum \
            pandoc README.md -o brad-phelan-cv.pdf \
              --pdf-engine=wkhtmltopdf \
              --pdf-engine-opt="--enable-local-file-access" \
              --css style.css \
              --metadata title="Brad Phelan — CV" \
              -V margin-top=20mm \
              -V margin-bottom=20mm \
              -V margin-left=25mm \
              -V margin-right=25mm

      - name: Build German PDF
        run: |
          xvfb-run --auto-servernum \
            pandoc README.de.md -o brad-phelan-cv-de.pdf \
              --pdf-engine=wkhtmltopdf \
              --pdf-engine-opt="--enable-local-file-access" \
              --css style.css \
              --metadata title="Brad Phelan — Lebenslauf" \
              -V margin-top=20mm \
              -V margin-bottom=20mm \
              -V margin-left=25mm \
              -V margin-right=25mm

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            brad-phelan-cv.pdf
            brad-phelan-cv-de.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
