name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and wkhtmltopdf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc wkhtmltopdf xvfb

      - name: Build English HTML
        run: |
          pandoc README.md -o brad-phelan-cv.html \
            --standalone \
            --css style.css \
            --metadata title="Brad Phelan — CV"

      - name: Build English PDF
        run: |
          xvfb-run --auto-servernum \
            pandoc README.md -o brad-phelan-cv.pdf \
              --pdf-engine=wkhtmltopdf \
              --pdf-engine-opt="--enable-local-file-access" \
              --css style.css \
              --metadata title="Brad Phelan — CV" \
              -V margin-top=20mm \
              -V margin-bottom=20mm \
              -V margin-left=25mm \
              -V margin-right=25mm

      - name: Build German HTML
        run: |
          pandoc README.de.md -o brad-phelan-cv-de.html \
            --standalone \
            --css style.css \
            --metadata title="Brad Phelan — Lebenslauf"

      - name: Build German PDF
        run: |
          xvfb-run --auto-servernum \
            pandoc README.de.md -o brad-phelan-cv-de.pdf \
              --pdf-engine=wkhtmltopdf \
              --pdf-engine-opt="--enable-local-file-access" \
              --css style.css \
              --metadata title="Brad Phelan — Lebenslauf" \
              -V margin-top=20mm \
              -V margin-bottom=20mm \
              -V margin-left=25mm \
              -V margin-right=25mm

      - name: Commit build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brad-phelan-cv.html brad-phelan-cv.pdf \
                  brad-phelan-cv-de.html brad-phelan-cv-de.pdf
          git diff --cached --quiet || git commit -m "ci: rebuild CV [skip ci]"
          git push
